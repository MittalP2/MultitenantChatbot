<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoChat · Week 2 Financial RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f3ee;
      --card: #fffcf7;
      --line: #e4e0d8;
      --text: #1f1e1d;
      --muted: #6f6b64;
      --accent: #1c4ed8;
      --accent-soft: #dce6fb;
      --accent-ink: #163a9c;
      --good: #3d6b4f;
      --shadow: 0 10px 40px rgba(60, 45, 30, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    h1, h2 { font-family: Newsreader, Georgia, serif; font-weight: 550; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }
    .kicker {
      color: var(--accent);
      letter-spacing: .14em;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    h1 { font-size: 32px; margin: 8px 0 8px; }
    .lede { color: var(--muted); max-width: 720px; margin: 0 0 18px; }
    .status { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .status.ok { color: var(--good); }
    .status.bad { color: #a33; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chip, .send {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 7px 13px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); }
    form {
      display: flex;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 8px 8px 16px;
      box-shadow: var(--shadow);
      max-width: 820px;
    }
    input[type="text"] {
      flex: 1; border: 0; outline: none; background: transparent;
      font: inherit; font-size: 16px;
    }
    button.send {
      background: var(--accent); color: #fff; border: 0;
      border-radius: 14px; padding: 10px 16px; font-weight: 600;
    }
    button.send:disabled { opacity: .5; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }
    .card h3 { margin: 0 0 8px; font-size: 16px; }
    .hit { color: var(--good); font-weight: 600; font-size: 13px; }
    .src { font-size: 13px; color: var(--muted); margin: 4px 0; }
    .preview { font-size: 14px; color: var(--text); }
    .answer {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      white-space: pre-wrap;
    }
    .thinking { color: var(--muted); font-style: italic; }
    a { color: var(--accent-ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Week 2 · Financial Document Intelligence</div>
    <h1>10-K RAG — chunking vs rerank</h1>
    <p class="lede">
      Same question, four retrieval setups: fixed-size vs semantic chunks, each with and without rerank.
      The answer below uses the measured winner: <strong>fixed-size + rerank</strong>.
      Full numbers: <a href="/report">comparison report</a>
      · <a href="/week1">Week 1 BMW</a>.
    </p>
    <div id="status" class="status">Checking index…</div>
    <div class="chips">
      <button class="chip" type="button" data-q="What products and services does Tesla sell besides electric cars?">Tesla products</button>
      <button class="chip" type="button" data-q="What competition risks does Tesla disclose in its 10-K?">Tesla competition</button>
      <button class="chip" type="button" data-q="What risk factors does Harley-Davidson highlight around demand, tariffs, or dealers?">Harley risks</button>
      <button class="chip" type="button" data-q="What vehicle categories does Polaris sell, such as off-road, motorcycles, or boats?">Polaris products</button>
    </div>
    <form id="form">
      <input id="q" type="text" autocomplete="off" placeholder="Ask a 10-K question…" />
      <button class="send" id="send" type="submit">Compare</button>
    </form>
    <div id="grid" class="grid"></div>
    <div id="answer" class="answer" style="display:none"></div>
  </div>
  <script>
    const statusEl = document.getElementById("status");
    const grid = document.getElementById("grid");
    const answerEl = document.getElementById("answer");
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const sendBtn = document.getElementById("send");
    let busy = false;

    async function ping() {
      try {
        const r = await fetch("/api/health-sec");
        const data = await r.json();
        if (!data.store) {
          statusEl.textContent = "Index missing. Run: py -3.12 ingestion/run_ingest_sec.py";
          statusEl.className = "status bad";
          return false;
        }
        statusEl.textContent = "Connected · Tesla / Harley-Davidson / Polaris 10-K extracts";
        statusEl.className = "status ok";
        return true;
      } catch {
        statusEl.textContent = "Start the server: py -3.12 app/showcase_server.py";
        statusEl.className = "status bad";
        return false;
      }
    }

    function card(title, hit) {
      const top = (hit.hits && hit.hits[0]) || {};
      const preview = (top.text || "").replace(/\s+/g, " ");
      return `<div class="card">
        <h3>${title}</h3>
        <div class="hit">${top.document ? "Top hit" : "No hit"}</div>
        <div class="src">${top.document || ""} p.${top.page || "—"} · score ${top.score ?? "—"}</div>
        <div class="preview">${preview}</div>
      </div>`;
    }

    async function run(question) {
      if (!question || busy) return;
      busy = true;
      sendBtn.disabled = true;
      grid.innerHTML = '<div class="card thinking">Retrieving four rankings…</div>';
      answerEl.style.display = "none";
      try {
        const r = await fetch("/api/compare", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, answer: true }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "Request failed");
        const c = data.conditions;
        grid.innerHTML =
          card("Fixed-size, no rerank", c.fixed_plain) +
          card("Fixed-size + rerank", c.fixed_rerank) +
          card("Semantic, no rerank", c.semantic_plain) +
          card("Semantic + rerank", c.semantic_rerank);
        answerEl.style.display = "block";
        const src = (data.sources || []).map((s) => s.document + " p." + s.page).join(" · ");
        answerEl.textContent = "Answer (fixed + rerank)\n\n" + (data.answer || "") +
          (src ? "\n\nSources: " + src : "");
      } catch (e) {
        grid.innerHTML = `<div class="card">${e.message}</div>`;
      } finally {
        busy = false;
        sendBtn.disabled = false;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = input.value.trim();
      input.value = "";
      run(q);
    });
    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => run(btn.dataset.q));
    });
    ping();
  </script>
</body>
</html>
